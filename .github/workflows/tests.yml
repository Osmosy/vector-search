# Правка этого файла требует токена с правом Workflows (fine-grained PAT).
name: tests

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # PDF-тесты используют pdftotext из poppler-utils.
      - name: poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Зависимости
        run: uv sync --locked

      - name: Линтер
        run: uv run ruff check .

      - name: Тесты
        run: uv run pytest -m "not network"

      - name: Пакет собирается и импортируется
        run: |
          uv build
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import vsearch; from vsearch import fetch, verify, claims; print('ok')"
